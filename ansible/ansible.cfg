[defaults]
inventory = inventory.yml
host_key_checking = False
interpreter_python = auto_silent
# The streamer is reached through the frontend (jump host); allow for slow hops
timeout = 60
# Run pending handlers (e.g. "Restart stream" after a key rotation) even if a later task fails
force_handlers = True
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
