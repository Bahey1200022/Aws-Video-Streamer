- name: WireGuard keys (both hosts)
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init (NAT setup, apt locks)
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Install WireGuard
      ansible.builtin.apt:
        name: wireguard-tools
        update_cache: true
        cache_valid_time: 3600

    - name: Generate private key on the host (kept if it already exists)
      ansible.builtin.shell: umask 077 && wg genkey > /etc/wireguard/private.key
      args:
        creates: /etc/wireguard/private.key

    - name: Derive public key
      ansible.builtin.shell: wg pubkey < /etc/wireguard/private.key
      register: wg_pub
      changed_when: false

    - name: Share public key with the other host
      ansible.builtin.set_fact:
        wg_public_key: "{{ wg_pub.stdout }}"

- name: Web Frontend (nginx + RTMP, HLS/DASH, Let's Encrypt)
  hosts: frontend
  become: true
  gather_facts: false
  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name: [nginx, libnginx-mod-rtmp, ffmpeg]
        update_cache: true
        cache_valid_time: 3600

    - name: Configure WireGuard tunnel (listens for the streamer)
      ansible.builtin.template:
        src: wg0.conf.j2
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
      vars:
        wg_address: "{{ wg_frontend_ip }}"
        wg_listen: true
        wg_peer_public_key: "{{ hostvars['video-streamer'].wg_public_key }}"
        wg_peer_ip: "{{ wg_streamer_ip }}"
        wg_peer_endpoint: ""
      notify: Restart WireGuard

    - name: Start WireGuard tunnel
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: started
        enabled: true

    - name: Create stream root folders for HLS and DASH chunks
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"
      loop:
        - /var/www/html/stream
        - /var/www/html/stream/hls
        - /var/www/html/stream/dash

    - name: Install certbot with the Route 53 DNS plugin
      ansible.builtin.apt:
        name: [certbot, python3-certbot-dns-route53]
      when: enable_tls | bool

    - name: Request certificate (DNS-01 challenge through Route 53)
      ansible.builtin.command: >
        certbot certonly --dns-route53 -d {{ fqdn }}
        --non-interactive --agree-tos --register-unsafely-without-email
        {{ '--staging' if letsencrypt_staging | bool else '' }}
      args:
        creates: /etc/letsencrypt/live/{{ fqdn }}/fullchain.pem
      when: enable_tls | bool

    - name: Check for certificate
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/{{ fqdn }}/fullchain.pem
      register: cert

    - name: Configure nginx (main config with RTMP ingest)
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: "0600" # contains the stream key
      notify: Reload nginx

    - name: Configure streamer site (serves HLS and DASH chunks)
      ansible.builtin.template:
        src: streamer.site.j2
        dest: /etc/nginx/sites-available/streamer
        mode: "0644"
      vars:
        tls_active: "{{ cert.stat.exists }}"
      notify: Reload nginx

    - name: Enable streamer site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/streamer
        dest: /etc/nginx/sites-enabled/streamer
        state: link
      notify: Reload nginx

    - name: Disable default site (it would take port 80 as default_server)
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Install player page
      ansible.builtin.template:
        src: index.html.j2
        dest: /var/www/html/index.html
        mode: "0644"

    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Restart WireGuard
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: restarted

    # Restart rather than reload: a reload keeps the old listening sockets, so
    # moving a listener (e.g. 127.0.0.1:8080 <-> 0.0.0.0:8080) fails with
    # "could not bind()" while systemd still reports success, leaving the old
    # config running. RTMP publishers reconnect either way.
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: restarted

- name: Video Streamer (ffmpeg loop to RTMP)
  hosts: streamer
  become: true
  gather_facts: false
  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name: [ffmpeg]
        update_cache: true
        cache_valid_time: 3600

    - name: Create video folder
      ansible.builtin.file:
        path: "{{ video_dir }}"
        state: directory
        mode: "0755"

    # download.blender.org returns 403 to AWS IPs, so fetch it on the
    # control machine once and upload it from there
    - name: Download video on the control machine
      ansible.builtin.get_url:
        url: "{{ video_url }}"
        dest: "{{ playbook_dir }}/files/{{ video_file }}"
        mode: "0644"
      delegate_to: localhost
      become: false
      # Download once for all streamers. Safe with the default "linear"
      # strategy this playbook uses (ansible-lint warns about "free")
      run_once: true # noqa: run-once[task]

    - name: Upload video to the streamer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/{{ video_file }}"
        dest: "{{ video_dir }}/{{ video_file }}"
        mode: "0644"
      notify: Restart stream

    - name: Configure WireGuard tunnel (connects to the frontend)
      ansible.builtin.template:
        src: wg0.conf.j2
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
      vars:
        wg_address: "{{ wg_streamer_ip }}"
        wg_listen: false
        wg_peer_public_key: "{{ hostvars['web-frontend'].wg_public_key }}"
        wg_peer_ip: "{{ wg_frontend_ip }}"
        wg_peer_endpoint: "{{ frontend_private_ip }}:{{ wg_port }}"
      notify:
        - Restart WireGuard
        - Restart stream

    - name: Start WireGuard tunnel
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: started
        enabled: true

    - name: Install stream key (root-only)
      ansible.builtin.template:
        src: ffmpeg-stream.env.j2
        dest: /etc/ffmpeg-stream.env
        owner: root
        group: root
        mode: "0600"
      notify: Restart stream

    - name: Install streaming service
      ansible.builtin.template:
        src: ffmpeg-stream.service.j2
        dest: /etc/systemd/system/ffmpeg-stream.service
        mode: "0644"
      notify: Restart stream

    - name: Start streaming service
      ansible.builtin.systemd:
        name: ffmpeg-stream
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart WireGuard
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: restarted

    - name: Restart stream
      ansible.builtin.systemd:
        name: ffmpeg-stream
        state: restarted
        daemon_reload: true
