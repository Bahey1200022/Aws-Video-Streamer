# The streamer has no internet access at all. It gets Ubuntu packages and
# security updates through a package proxy on the frontend, so the proxy must
# be ready before anything is installed on the streamer.
- name: Package proxy on the frontend (apt-cacher-ng)
  hosts: frontend
  become: true
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init (apt locks)
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Install apt-cacher-ng
      ansible.builtin.apt:
        name: apt-cacher-ng
        update_cache: true
        cache_valid_time: 3600

    # Listen only on the frontend's private VPC address (and localhost), never
    # on the public side; the firewall also limits it to the private subnet
    - name: Bind the proxy to the private address
      ansible.builtin.lineinfile:
        path: /etc/apt-cacher-ng/acng.conf
        regexp: '^#?\s*BindAddress:'
        line: "BindAddress: localhost {{ frontend_private_ip }}"
      notify: Restart apt-cacher-ng

    - name: Start apt-cacher-ng
      ansible.builtin.service:
        name: apt-cacher-ng
        state: started
        enabled: true

  handlers:
    - name: Restart apt-cacher-ng
      ansible.builtin.service:
        name: apt-cacher-ng
        state: restarted

- name: Point the private servers' apt at the frontend's proxy
  hosts: streamer:monitoring
  become: true
  gather_facts: false
  tasks:
    - name: Wait for SSH (through the frontend)
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init (apt locks)
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Use the frontend's package proxy (no internet in the private subnet)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/01proxy
        content: |
          // Installed by Ansible: all package downloads go through the
          // frontend's apt-cacher-ng (the streamer has no internet route)
          Acquire::http::Proxy "http://{{ frontend_private_ip }}:3142";
        mode: "0644"

    # A new server has never downloaded its package lists (cloud-init tried
    # the internet, which the private subnet doesn't have), so apt knows no
    # packages until it refreshes them once through the proxy
    - name: Refresh the package lists through the proxy
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      # Refreshing the lists isn't a configuration change
      changed_when: false

- name: WireGuard keys (frontend and streamer)
  hosts: frontend:streamer
  become: true
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Wait for cloud-init (apt locks)
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Install WireGuard
      ansible.builtin.apt:
        name: wireguard-tools
        update_cache: true
        cache_valid_time: 3600

    - name: Generate private key on the host (kept if it already exists)
      ansible.builtin.shell: umask 077 && wg genkey > /etc/wireguard/private.key
      args:
        creates: /etc/wireguard/private.key

    - name: Derive public key
      ansible.builtin.shell: wg pubkey < /etc/wireguard/private.key
      register: wg_pub
      changed_when: false

    - name: Share public key with the other host
      ansible.builtin.set_fact:
        wg_public_key: "{{ wg_pub.stdout }}"

- name: Web Frontend (nginx + RTMP, HLS/DASH, Let's Encrypt)
  hosts: frontend
  become: true
  gather_facts: false
  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name: [nginx, libnginx-mod-rtmp, ffmpeg]
        update_cache: true
        cache_valid_time: 3600

    - name: Configure WireGuard tunnel (listens for the streamer)
      ansible.builtin.template:
        src: wg0.conf.j2
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
      vars:
        wg_address: "{{ wg_frontend_ip }}"
        wg_listen: true
        wg_peers:
          - name: Video Streamer
            public_key: "{{ hostvars['video-streamer'].wg_public_key }}"
            ip: "{{ wg_streamer_ip }}"
      notify: Restart WireGuard

    - name: Start WireGuard tunnel
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: started
        enabled: true

    - name: Create stream root folders for HLS and DASH chunks
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"
      loop:
        - /var/www/html/stream
        - /var/www/html/stream/hls
        - /var/www/html/stream/dash

    - name: Install certbot (+ Route 53 plugin for DNS-01)
      ansible.builtin.apt:
        name: "{{ ['certbot'] + (['python3-certbot-dns-route53'] if acme_challenge == 'dns' else []) }}"
      when: enable_tls | bool

    # HTTP-01: Let's Encrypt downloads a token from
    # http://<fqdn>/.well-known/acme-challenge/ - nginx serves it from the web
    # root, so nginx must be running with port 80 open before this runs
    - name: Create ACME challenge folder
      ansible.builtin.file:
        path: /var/www/html/.well-known/acme-challenge
        state: directory
        mode: "0755"
      when: enable_tls | bool and acme_challenge == 'http'

    - name: Check for an existing certificate
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/{{ cert_name }}/fullchain.pem
      register: cert_before

    # Only needed for a first issue. Skipping it when a certificate exists also
    # lets the playbook get past a broken nginx config to the step that fixes it
    - name: Ensure nginx is serving port 80 for the challenge
      ansible.builtin.service:
        name: nginx
        state: started
      when: enable_tls | bool and acme_challenge == 'http' and not cert_before.stat.exists

    # Staging and production certificates get different names, so switching
    # letsencrypt_staging off really requests a new, trusted certificate
    - name: Request certificate
      ansible.builtin.command: >
        certbot certonly
        {{ '--dns-route53' if acme_challenge == 'dns' else '--webroot -w /var/www/html' }}
        -d {{ fqdn }} --cert-name {{ cert_name }}
        --non-interactive --agree-tos --register-unsafely-without-email
        {{ '--staging' if letsencrypt_staging | bool else '' }}
      args:
        creates: /etc/letsencrypt/live/{{ cert_name }}/fullchain.pem
      when: enable_tls | bool

    - name: Restart nginx after automatic renewals
      ansible.builtin.copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/restart-nginx.sh
        content: |
          #!/bin/sh
          # Installed by Ansible: load the renewed certificate
          systemctl restart nginx
        mode: "0755"
      when: enable_tls | bool

    - name: Check for certificate
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/{{ cert_name }}/fullchain.pem
      register: cert

    - name: Configure nginx (main config with RTMP ingest)
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: "0600" # contains the stream key
      vars:
        tls_active: "{{ cert.stat.exists }}"
      notify: Reload nginx

    - name: Configure streamer site (serves HLS and DASH chunks)
      ansible.builtin.template:
        src: streamer.site.j2
        dest: /etc/nginx/sites-available/streamer
        mode: "0644"
      vars:
        tls_active: "{{ cert.stat.exists }}"
      notify: Reload nginx

    - name: Enable streamer site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/streamer
        dest: /etc/nginx/sites-enabled/streamer
        state: link
      notify: Reload nginx

    - name: Disable default site (it would take port 80 as default_server)
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Validate nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Install player page
      ansible.builtin.template:
        src: index.html.j2
        dest: /var/www/html/index.html
        mode: "0644"
      vars:
        # Channels on the page. kind: hls (chunks, a few seconds behind) or
        # webrtc (real time, through MediaMTX)
        loop_channel:
          name: stream
          kind: hls
          label: Video loop
          title: "{{ video_title }}"
          pipeline:
            - ffmpeg on the Video Streamer
            - "RTMP + stream key|WireGuard 🔒"
            - nginx-rtmp on the Web Frontend
            - HLS (3 s) · DASH (15 s) chunks
            - Your browser
        phone_channel:
          name: phone
          kind: webrtc
          label: Phone · real time
          title: Phone camera
          pipeline:
            - Phone camera (Larix, any network)
            - "WebRTC (WHIP) + password|DTLS-SRTP 🔒"
            - MediaMTX on the Web Frontend
            - "WebRTC (WHEP): frame by frame, no chunks|DTLS-SRTP 🔒"
            - Your browser
        page_channels: "{{ [loop_channel] + ([phone_channel] if enable_webrtc | default(false) | bool else []) }}"

    # The frontend used to be a NAT router for the streamer (nat.sh boot
    # script). The streamer now has no internet route: undo the NAT
    - name: Stop the old NAT service (leftover)
      ansible.builtin.systemd:
        name: mss-nat
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove the NAT rule and turn IP forwarding off
      ansible.builtin.shell: |
        set -o pipefail
        changed=no
        while iptables -t nat -S POSTROUTING | grep -q MASQUERADE; do
          rule=$(iptables -t nat -S POSTROUTING | grep MASQUERADE | head -1 | sed 's/^-A/-D/')
          eval iptables -t nat $rule && changed=yes
        done
        if [ "$(sysctl -n net.ipv4.ip_forward)" = 1 ]; then
          sysctl -w net.ipv4.ip_forward=0 >/dev/null && changed=yes
        fi
        echo $changed
      args:
        executable: /bin/bash
      register: nat_cleanup
      changed_when: nat_cleanup.stdout == "yes"

    - name: Remove the old NAT service files (leftover)
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/mss-nat.service
        - /usr/local/sbin/mss-nat.sh

    # The live-camera and weather features were removed: clean up anything
    # an earlier deployment left on the server
    - name: Stop the old camera pull service (leftover)
      ansible.builtin.systemd:
        name: camera-ingest
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove camera and weather leftovers
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/camera-ingest.service
        - /etc/camera-ingest.env
        - /etc/nginx/camera.htpasswd
        - /var/www/html/camera
        - /var/www/html/stream/camera-hls
        - /var/www/html/stream/camera-dash
        - /var/cache/nginx/weather

    # The Stream Studio experiment (Flask app in Docker) was dropped: remove
    # its service, container, images, Docker itself and its files
    - name: Check for Docker (Stream Studio leftover)
      ansible.builtin.stat:
        path: /usr/bin/docker
      register: docker_bin

    - name: Stop the Stream Studio service (leftover)
      ansible.builtin.systemd:
        name: studio
        state: stopped
        enabled: false
      failed_when: false
      when: docker_bin.stat.exists

    - name: Remove the Stream Studio container and images (leftover)
      ansible.builtin.shell: |
        docker rm -f studio 2>/dev/null || true
        docker image rm -f studio:latest python:3.12-slim 2>/dev/null || true
      changed_when: true
      when: docker_bin.stat.exists

    - name: Uninstall Docker (only the Studio used it)
      ansible.builtin.apt:
        name: [docker.io, containerd, runc]
        state: absent
        purge: true
        autoremove: true
      when: docker_bin.stat.exists

    - name: Remove Stream Studio and Docker leftovers
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/studio.service
        - /etc/studio.env
        - /opt/studio
        - /var/lib/studio
        - /etc/nginx/studio_proxy.conf
        - /etc/docker
        - /var/lib/docker
        - /var/lib/containerd

    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    # Safety net: if an earlier run wrote new config but stopped before the
    # restart (e.g. a failed config check), files are "unchanged" now and no
    # handler fires - restart if any config file is newer than the running nginx
    - name: Restart nginx if its running config is older than the files
      ansible.builtin.shell: |
        set -o pipefail
        started=$(date -d "$(systemctl show nginx -p ActiveEnterTimestamp --value)" +%s)
        newest=$(find /etc/nginx -type f -printf '%T@\n' | sort -n | tail -1 | cut -d. -f1)
        if [ "$newest" -gt "$started" ]; then
          nginx -t && systemctl restart nginx && echo restarted
        fi
      args:
        executable: /bin/bash
      register: nginx_stale
      changed_when: "'restarted' in nginx_stale.stdout"

  handlers:
    - name: Restart WireGuard
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: restarted

    # Restart rather than reload: a reload keeps the old listening sockets, so
    # moving a listener (e.g. 127.0.0.1:8080 <-> 0.0.0.0:8080) fails with
    # "could not bind()" while systemd still reports success, leaving the old
    # config running. RTMP publishers reconnect either way.
    # Only restart if the configuration is valid: restarting nginx with a bad
    # config stops it (and force_handlers runs this even after a failed task)
    - name: Reload nginx
      ansible.builtin.shell: nginx -t && systemctl restart nginx
      changed_when: true

- name: Video Streamer (ffmpeg loop to RTMP)
  hosts: streamer
  become: true
  gather_facts: false
  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name: [ffmpeg]
        update_cache: true
        cache_valid_time: 3600

    - name: Create video folder
      ansible.builtin.file:
        path: "{{ video_dir }}"
        state: directory
        mode: "0755"

    # download.blender.org returns 403 to AWS IPs, so fetch it on the
    # control machine once and upload it from there
    - name: Download video on the control machine
      ansible.builtin.get_url:
        url: "{{ video_url }}"
        dest: "{{ playbook_dir }}/files/{{ video_file }}"
        mode: "0644"
      delegate_to: localhost
      become: false
      # Download once for all streamers. Safe with the default "linear"
      # strategy this playbook uses (ansible-lint warns about "free")
      run_once: true # noqa: run-once[task]

    - name: Upload video to the streamer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/{{ video_file }}"
        dest: "{{ video_dir }}/{{ video_file }}"
        mode: "0644"
      notify: Restart stream

    - name: Configure WireGuard tunnel (connects to the frontend)
      ansible.builtin.template:
        src: wg0.conf.j2
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: "0600"
      vars:
        wg_address: "{{ wg_streamer_ip }}"
        wg_listen: false
        wg_peers:
          - name: Web Frontend
            public_key: "{{ hostvars['web-frontend'].wg_public_key }}"
            ip: "{{ wg_frontend_ip }}"
            endpoint: "{{ frontend_private_ip }}:{{ wg_port }}"
      notify:
        - Restart WireGuard
        - Restart stream

    - name: Start WireGuard tunnel
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: started
        enabled: true

    - name: Install stream key (root-only)
      ansible.builtin.template:
        src: ffmpeg-stream.env.j2
        dest: /etc/ffmpeg-stream.env
        owner: root
        group: root
        mode: "0600"
      notify: Restart stream

    - name: Install streaming service
      ansible.builtin.template:
        src: ffmpeg-stream.service.j2
        dest: /etc/systemd/system/ffmpeg-stream.service
        mode: "0644"
      notify: Restart stream

    - name: Start streaming service
      ansible.builtin.systemd:
        name: ffmpeg-stream
        state: started
        enabled: true
        daemon_reload: true

    # ffmpeg used to have the key in its URL and repeated the URL in its error
    # messages, so old system logs contain it. Restart ffmpeg first (its last
    # message as the old process could still contain the key), then remove the
    # key from the logs - before any log shipping (Alloy) can pick it up.
    - name: Apply a new ffmpeg configuration now
      ansible.builtin.meta: flush_handlers

    - name: Remove stream keys leaked into old system logs
      ansible.builtin.shell: |
        set -o pipefail
        # A real key: "key=" + letters/digits, but not the word REDACTED
        has_key() { grep -oE 'key=[A-Za-z0-9]+' | grep -qvx 'key=REDACTED'; }
        found=0
        if journalctl --no-pager -q | has_key; then found=1; fi
        for f in /var/log/syslog*; do
          if zcat -f "$f" | has_key; then found=1; fi
        done
        if [ "$found" = 0 ]; then echo "clean"; exit 0; fi
        # The journal cannot be edited: archive it and delete the archives
        journalctl --rotate
        journalctl --vacuum-time=1s
        # Text logs: replace the key, keeping the same file so rsyslog
        # carries on writing to it
        for f in /var/log/syslog*; do
          zcat -f "$f" | has_key || continue
          case "$f" in
            *.gz) zcat "$f" | sed -E 's/key=[A-Za-z0-9]+/key=REDACTED/g' | gzip > "$f.tmp" && mv "$f.tmp" "$f" ;;
            *) sed -E 's/key=[A-Za-z0-9]+/key=REDACTED/g' "$f" > "$f.tmp" && cat "$f.tmp" > "$f" && rm "$f.tmp" ;;
          esac
        done
        echo "cleaned"
      args:
        executable: /bin/bash
      register: leak_cleanup
      changed_when: "'cleaned' in leak_cleanup.stdout"

  handlers:
    - name: Restart WireGuard
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: restarted

    - name: Restart stream
      ansible.builtin.systemd:
        name: ffmpeg-stream
        state: restarted
        daemon_reload: true

# The lab stops the servers every night, so Ubuntu's daily update timer often
# never fires while they are up and security updates pile up. Declare the
# automatic updates explicitly, and also apply pending security updates on
# every deployment ("patch on deploy"). The streamer gets them through the
# frontend's package proxy.
- name: Security updates (both hosts)
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades

    - name: Turn on daily automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          // Installed by Ansible: refresh the package lists and install
          // security updates every day
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";
        mode: "0644"

    - name: Apply pending security updates now
      ansible.builtin.command: unattended-upgrade --verbose
      register: patch
      # Ubuntu's own daily run may hold the apt lock (it happened on the first
      # deployment and took ~2.5 minutes): keep trying for up to 5 minutes
      retries: 10
      delay: 30
      until: patch.rc == 0
      changed_when: "'Packages that will be upgraded' in patch.stdout"

    - name: Check whether an update needs a reboot (kernel, libc...)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    # Every service (nginx, WireGuard, the proxy, ffmpeg) is enabled at boot,
    # so the platform comes back on its own; the stream resumes within a minute
    - name: Reboot to load the updates
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: reboot_required.stat.exists

# Monitoring agents. node_exporter publishes each server's metrics (CPU,
# memory, disk, network, services, pending updates) on its PRIVATE address
# only, for Prometheus on the monitoring server to scrape. The frontend also
# runs a small collector for the stream's health. Skipped when the monitoring
# server is disabled (enable_monitoring = false in Terraform).
- name: Monitoring agents (all servers)
  hosts: all
  become: true
  gather_facts: false
  vars:
    textfile_dir: /var/lib/prometheus/node-exporter
    node_exporter_address: >-
      {{ '127.0.0.1' if inventory_hostname in groups.get('monitoring', [])
         else (frontend_private_ip if inventory_hostname in groups['frontend'] else ansible_host) }}
    node_exporter_args: >-
      --web.listen-address={{ node_exporter_address }}:9100
      --collector.systemd
      --collector.systemd.unit-include={{ monitored_units }}
      --collector.textfile.directory={{ textfile_dir }}
  tasks:
    - name: Monitoring agents
      when: groups.get('monitoring', []) | length > 0
      block:
        - name: Install node_exporter (and its apt / reboot-required collectors)
          ansible.builtin.apt:
            name: prometheus-node-exporter

        - name: Configure node_exporter (private address, services, textfile metrics)
          ansible.builtin.copy:
            dest: /etc/default/prometheus-node-exporter
            content: |
              # Installed by Ansible
              ARGS="{{ node_exporter_args }}"
            mode: "0644"
          notify: Restart node_exporter

        - name: Start node_exporter
          ansible.builtin.systemd:
            name: prometheus-node-exporter
            state: started
            enabled: true

        - name: Stream metrics collector (frontend)
          when: inventory_hostname in groups['frontend']
          block:
            # The package creates this folder as root-only (its apt.prom is
            # written by a root timer). The collector runs as the unprivileged
            # prometheus user, so the group gets write access - nothing more
            - name: Let the collector write its file in the textfile folder
              ansible.builtin.file:
                path: "{{ textfile_dir }}"
                state: directory
                owner: root
                group: prometheus
                mode: "0775"

            - name: Install the stream metrics script
              ansible.builtin.template:
                src: mss-stream-metrics.py.j2
                dest: /usr/local/bin/mss-stream-metrics
                mode: "0755"

            - name: Install the stream metrics service (sandboxed)
              ansible.builtin.copy:
                dest: /etc/systemd/system/mss-stream-metrics.service
                content: |
                  # Installed by Ansible
                  [Unit]
                  Description=MSS stream metrics for node_exporter (chunk age, publisher, bitrate)

                  [Service]
                  Type=oneshot
                  User=prometheus
                  ExecStart=/usr/local/bin/mss-stream-metrics
                  # Only needs to read the HLS folder, ask nginx-rtmp on
                  # localhost, and write one file
                  NoNewPrivileges=yes
                  CapabilityBoundingSet=
                  ProtectSystem=strict
                  ReadWritePaths={{ textfile_dir }}
                  ProtectHome=yes
                  PrivateTmp=yes
                  PrivateDevices=yes
                  ProtectKernelTunables=yes
                  ProtectKernelModules=yes
                  ProtectControlGroups=yes
                  RestrictAddressFamilies=AF_INET
                  IPAddressDeny=any
                  IPAddressAllow=localhost
                mode: "0644"

            - name: Run it every 15 seconds
              ansible.builtin.copy:
                dest: /etc/systemd/system/mss-stream-metrics.timer
                content: |
                  # Installed by Ansible
                  [Unit]
                  Description=Collect MSS stream metrics every 15 seconds

                  [Timer]
                  OnBootSec=30s
                  OnUnitActiveSec=15s
                  AccuracySec=1s

                  [Install]
                  WantedBy=timers.target
                mode: "0644"

            - name: Start the stream metrics timer
              ansible.builtin.systemd:
                name: mss-stream-metrics.timer
                state: started
                enabled: true
                daemon_reload: true

  handlers:
    - name: Restart node_exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        state: restarted

# The monitoring server: Prometheus (metrics), blackbox_exporter (probes the
# website like a viewer) and Grafana (dashboards). Everything listens on
# localhost only; Grafana is reached through an SSH tunnel (Terraform output
# "grafana_tunnel"). Grafana isn't in Ubuntu's repositories: it is downloaded
# on the control machine, checked against its pinned SHA-256, and uploaded.
- name: Monitoring server (Prometheus, blackbox_exporter, Loki, Grafana)
  hosts: monitoring
  become: true
  gather_facts: false
  vars:
    package_dir: /var/cache/mss-packages
  tasks:
    - name: Install Prometheus and blackbox_exporter
      ansible.builtin.apt:
        name: [prometheus, prometheus-blackbox-exporter]

    - name: Prometheus settings (localhost only, retention)
      ansible.builtin.copy:
        dest: /etc/default/prometheus
        content: |
          # Installed by Ansible
          ARGS="--web.listen-address=127.0.0.1:9090 --storage.tsdb.retention.time={{ monitoring_retention_days }}d"
        mode: "0644"
      notify: Restart Prometheus

    - name: Prometheus scrape targets
      ansible.builtin.template:
        src: prometheus.yml.j2
        dest: /etc/prometheus/prometheus.yml
        mode: "0644"
        validate: promtool check config %s
      notify: Restart Prometheus

    - name: Settings for blackbox_exporter (localhost only)
      ansible.builtin.copy:
        dest: /etc/default/prometheus-blackbox-exporter
        content: |
          # Installed by Ansible
          ARGS="--config.file=/etc/prometheus/blackbox.yml --web.listen-address=127.0.0.1:9115"
        mode: "0644"
      notify: Restart blackbox_exporter

    - name: Website probes
      ansible.builtin.template:
        src: blackbox.yml.j2
        dest: /etc/prometheus/blackbox.yml
        mode: "0644"
      notify: Restart blackbox_exporter

    # Loki's package starts Loki as soon as it is installed, with a demo
    # config (all interfaces, debug logs, data in /tmp). So our config and
    # the systemd drop-in that points to it are written BEFORE the install:
    # the very first start already uses them.
    - name: Create Loki's config folder
      ansible.builtin.file:
        path: /etc/loki
        state: directory
        mode: "0755"

    - name: Loki settings (private IP, retention)
      ansible.builtin.template:
        src: loki.yml.j2
        dest: /etc/loki/mss.yml
        mode: "0644"
      notify: Restart Loki

    - name: Create the Loki drop-in folder
      ansible.builtin.file:
        path: /etc/systemd/system/loki.service.d
        state: directory
        mode: "0755"

    - name: Run Loki with our settings, sandboxed
      ansible.builtin.copy:
        dest: /etc/systemd/system/loki.service.d/mss.conf
        content: |
          # Installed by Ansible
          [Service]
          ExecStart=
          ExecStart=/usr/bin/loki -config.file=/etc/loki/mss.yml
          # /var/lib/loki, owned by the loki user, is its only writable folder
          StateDirectory=loki
          StateDirectoryMode=0750
          NoNewPrivileges=yes
          CapabilityBoundingSet=
          ProtectSystem=strict
          ProtectHome=yes
          PrivateTmp=yes
          PrivateDevices=yes
          ProtectKernelTunables=yes
          ProtectKernelModules=yes
          ProtectKernelLogs=yes
          ProtectControlGroups=yes
          ProtectClock=yes
          ProtectHostname=yes
          RestrictNamespaces=yes
          RestrictRealtime=yes
          RestrictSUIDSGID=yes
          LockPersonality=yes
          RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
          SystemCallArchitectures=native
          SystemCallFilter=@system-service
        mode: "0644"
      notify: Restart Loki

    - name: Download Loki on the control machine (checksum verified)
      ansible.builtin.get_url:
        url: "{{ loki_url }}"
        dest: "{{ playbook_dir }}/files/{{ loki_deb }}"
        checksum: "sha256:{{ loki_sha256 }}"
        mode: "0644"
      delegate_to: localhost
      become: false
      run_once: true # noqa: run-once[task]

    - name: Create the package folder
      ansible.builtin.file:
        path: "{{ package_dir }}"
        state: directory
        mode: "0755"

    - name: Upload Loki
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/{{ loki_deb }}"
        dest: "{{ package_dir }}/{{ loki_deb }}"
        mode: "0644"

    - name: Install Loki
      ansible.builtin.apt:
        deb: "{{ package_dir }}/{{ loki_deb }}"

    - name: Check the Loki settings
      ansible.builtin.command: /usr/bin/loki -verify-config -config.file=/etc/loki/mss.yml
      changed_when: false

    - name: Download Grafana on the control machine (checksum verified)
      ansible.builtin.get_url:
        url: "{{ grafana_url }}"
        dest: "{{ playbook_dir }}/files/{{ grafana_deb }}"
        checksum: "sha256:{{ grafana_sha256 }}"
        mode: "0644"
      delegate_to: localhost
      become: false
      run_once: true # noqa: run-once[task]

    - name: Upload Grafana
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/files/{{ grafana_deb }}"
        dest: "{{ package_dir }}/{{ grafana_deb }}"
        mode: "0644"

    - name: Install Grafana (its dependencies come through the package proxy)
      ansible.builtin.apt:
        deb: "{{ package_dir }}/{{ grafana_deb }}"

    - name: Grafana settings (root-only, it holds the admin password)
      ansible.builtin.template:
        src: grafana.env.j2
        dest: /etc/grafana/mss.env
        owner: root
        group: root
        mode: "0600"
      notify: Restart Grafana

    - name: Create the Grafana drop-in folder
      ansible.builtin.file:
        path: /etc/systemd/system/grafana-server.service.d
        state: directory
        mode: "0755"

    - name: Load the settings into Grafana's service
      ansible.builtin.copy:
        dest: /etc/systemd/system/grafana-server.service.d/mss.conf
        content: |
          # Installed by Ansible
          [Service]
          EnvironmentFile=/etc/grafana/mss.env
        mode: "0644"
      notify: Restart Grafana

    - name: Provision the data sources
      ansible.builtin.template:
        src: grafana-datasources.yml.j2
        dest: /etc/grafana/provisioning/datasources/mss.yml
        owner: root
        group: grafana
        mode: "0640"
      notify: Restart Grafana

    - name: Provision the dashboards
      ansible.builtin.template:
        src: grafana-dashboards.yml.j2
        dest: /etc/grafana/provisioning/dashboards/mss.yml
        owner: root
        group: grafana
        mode: "0640"
      notify: Restart Grafana

    - name: Create the dashboards folder
      ansible.builtin.file:
        path: /var/lib/grafana/dashboards/mss
        state: directory
        mode: "0755"

    # Grafana re-reads this folder every 10 seconds: no restart needed
    - name: Install the dashboards
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/dashboards/"
        dest: /var/lib/grafana/dashboards/mss/
        mode: "0644"

    - name: Start the monitoring services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - prometheus
        - prometheus-blackbox-exporter
        - loki
        - grafana-server

    - name: Apply pending restarts before checking Grafana
      ansible.builtin.meta: flush_handlers

    - name: Wait for Grafana
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 3000
        timeout: 120

    # The password in mss.env only applies when Grafana first creates its
    # database. Resetting it on every run makes a new Terraform password take
    # effect. Passed on stdin, never on the command line.
    - name: Set the Grafana admin password
      ansible.builtin.command:
        cmd: grafana cli --homepath /usr/share/grafana --config /etc/grafana/grafana.ini admin reset-admin-password --password-from-stdin
        stdin: "{{ grafana_admin_password }}"
      become: true
      become_user: grafana
      no_log: true
      changed_when: false

  handlers:
    - name: Restart Prometheus
      ansible.builtin.systemd:
        name: prometheus
        state: restarted

    - name: Restart blackbox_exporter
      ansible.builtin.systemd:
        name: prometheus-blackbox-exporter
        state: restarted

    - name: Restart Loki
      ansible.builtin.systemd:
        name: loki
        state: restarted
        daemon_reload: true

    - name: Restart Grafana
      ansible.builtin.systemd:
        name: grafana-server
        state: restarted
        daemon_reload: true

# Log agents. Alloy reads each server's logs (the systemd journal: SSH, sudo,
# services, updates; on the frontend also the nginx logs) and pushes them to
# Loki on the monitoring server. Runs after the monitoring server's play so
# Loki is already up. Skipped when the monitoring server is disabled.
- name: Log agents (all servers)
  hosts: all
  become: true
  gather_facts: false
  vars:
    package_dir: /var/cache/mss-packages
  tasks:
    - name: Log agents
      when: groups.get('monitoring', []) | length > 0
      block:
        - name: Download Alloy on the control machine (checksum verified)
          ansible.builtin.get_url:
            url: "{{ alloy_url }}"
            dest: "{{ playbook_dir }}/files/{{ alloy_deb }}"
            checksum: "sha256:{{ alloy_sha256 }}"
            mode: "0644"
          delegate_to: localhost
          become: false
          run_once: true # noqa: run-once[task]

        - name: Create the package folder
          ansible.builtin.file:
            path: "{{ package_dir }}"
            state: directory
            mode: "0755"

        - name: Upload Alloy
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/files/{{ alloy_deb }}"
            dest: "{{ package_dir }}/{{ alloy_deb }}"
            mode: "0644"

        # The package adds the alloy user to the adm and systemd-journal
        # groups, which can read the logs; it doesn't start Alloy by itself
        - name: Install Alloy
          ansible.builtin.apt:
            deb: "{{ package_dir }}/{{ alloy_deb }}"

        - name: Alloy options (no usage reporting, its web page on localhost)
          ansible.builtin.lineinfile:
            path: /etc/default/alloy
            regexp: "^CUSTOM_ARGS="
            line: CUSTOM_ARGS="--disable-reporting --server.http.listen-addr=127.0.0.1:12345"
          notify: Restart Alloy

        - name: What Alloy reads and where it sends it
          ansible.builtin.template:
            src: alloy.config.j2
            dest: /etc/alloy/config.alloy
            owner: root
            group: alloy
            mode: "0640"
            validate: alloy fmt %s
          notify: Restart Alloy

        - name: Create the Alloy drop-in folder
          ansible.builtin.file:
            path: /etc/systemd/system/alloy.service.d
            state: directory
            mode: "0755"

        - name: Sandbox Alloy and cap its memory
          ansible.builtin.copy:
            dest: /etc/systemd/system/alloy.service.d/mss.conf
            content: |
              # Installed by Ansible
              [Service]
              # Reads the logs, writes only its own data folder
              NoNewPrivileges=yes
              CapabilityBoundingSet=
              ProtectSystem=strict
              ReadWritePaths=/var/lib/alloy
              ProtectHome=yes
              PrivateTmp=yes
              PrivateDevices=yes
              ProtectKernelTunables=yes
              ProtectKernelModules=yes
              ProtectControlGroups=yes
              RestrictNamespaces=yes
              RestrictSUIDSGID=yes
              LockPersonality=yes
              RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
              SystemCallArchitectures=native
              SystemCallFilter=@system-service
              # Network: only Loki on the monitoring server (and localhost)
              IPAddressDeny=any
              IPAddressAllow=localhost {{ monitoring_private_ip }}
              # The frontend and the streamer have 1 GB of RAM
              MemoryMax=250M
              Environment=GOMEMLIMIT=180MiB
            mode: "0644"
          notify: Restart Alloy

        - name: Start Alloy
          ansible.builtin.systemd:
            name: alloy
            state: started
            enabled: true
            daemon_reload: true

  handlers:
    - name: Restart Alloy
      ansible.builtin.systemd:
        name: alloy
        state: restarted
        daemon_reload: true

# Convenience on the control machine: open Grafana at http://localhost:3000
# after every deployment. An SSH tunnel through the frontend (jump host) runs
# in the background; an old one is closed first, because the frontend gets a
# new public IP after each nightly restart. To reopen it without a full
# deployment: ansible-playbook site.yml --tags grafana
# Real-time phone camera (enable_webrtc in Terraform). MediaMTX receives
# the phone's WebRTC stream (WHIP) and sends it to browsers (WHEP) with less
# than a second of delay. nginx forwards the handshakes over HTTPS; the media
# uses UDP 8189. See docs/WEBRTC.md.
- name: Real-time phone camera (MediaMTX, WebRTC)
  hosts: frontend
  become: true
  gather_facts: false
  vars:
    mediamtx_dir: /opt/mediamtx/{{ mediamtx_version }}
  tasks:
    - name: MediaMTX
      when: enable_webrtc | default(false) | bool
      block:
        - name: Create the MediaMTX folders
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ mediamtx_dir }}"
            - /etc/mediamtx

        # The frontend has internet access: it downloads the release itself,
        # and Ansible refuses it if the checksum doesn't match
        - name: Download MediaMTX (checksum verified)
          ansible.builtin.get_url:
            url: "{{ mediamtx_url }}"
            dest: "{{ mediamtx_dir }}/mediamtx.tar.gz"
            checksum: "sha256:{{ mediamtx_sha256 }}"
            mode: "0644"

        - name: Unpack the MediaMTX program
          ansible.builtin.unarchive:
            src: "{{ mediamtx_dir }}/mediamtx.tar.gz"
            dest: "{{ mediamtx_dir }}"
            remote_src: true
            include: [mediamtx]
            creates: "{{ mediamtx_dir }}/mediamtx"
          notify: Restart MediaMTX

        # Holds only the publish password's hash, so it can be world-readable
        - name: MediaMTX settings
          ansible.builtin.template:
            src: mediamtx.yml.j2
            dest: /etc/mediamtx/mediamtx.yml
            mode: "0644"
          notify: Restart MediaMTX

        - name: MediaMTX service (sandboxed)
          ansible.builtin.copy:
            dest: /etc/systemd/system/mediamtx.service
            content: |
              # Installed by Ansible
              [Unit]
              Description=MediaMTX (WebRTC media server for the real-time phone camera)
              After=network-online.target
              Wants=network-online.target

              [Service]
              ExecStart={{ mediamtx_dir }}/mediamtx /etc/mediamtx/mediamtx.yml
              Restart=always
              RestartSec=5

              # --- Sandbox: a throwaway user, nothing writable ---
              # (it receives video from the internet, so it gets nothing else)
              DynamicUser=yes
              NoNewPrivileges=yes
              CapabilityBoundingSet=
              AmbientCapabilities=
              ProtectSystem=strict
              ProtectHome=yes
              PrivateTmp=yes
              PrivateDevices=yes
              UMask=0077
              ProtectKernelTunables=yes
              ProtectKernelModules=yes
              ProtectKernelLogs=yes
              ProtectControlGroups=yes
              ProtectClock=yes
              ProtectHostname=yes
              ProtectProc=invisible
              ProcSubset=pid
              RestrictNamespaces=yes
              RestrictRealtime=yes
              RestrictSUIDSGID=yes
              LockPersonality=yes
              MemoryDenyWriteExecute=yes
              RemoveIPC=yes
              # AF_NETLINK: the WebRTC library lists the network interfaces
              RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
              SystemCallArchitectures=native
              SystemCallFilter=@system-service
              SystemCallFilter=~@privileged @resources
              # The frontend is small: cap MediaMTX's memory
              MemoryMax=300M
              Environment=GOMEMLIMIT=220MiB

              [Install]
              WantedBy=multi-user.target
            mode: "0644"
          notify: Restart MediaMTX

        - name: Start MediaMTX
          ansible.builtin.systemd:
            name: mediamtx
            state: started
            enabled: true
            daemon_reload: true

        - name: Apply new MediaMTX settings now
          ansible.builtin.meta: flush_handlers

        - name: Wait for MediaMTX's handshake port
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 8889
            timeout: 30

    # enable_webrtc turned off: stop it (the firewall closes UDP 8189)
    - name: Stop MediaMTX when the real-time camera is off
      ansible.builtin.systemd:
        name: mediamtx
        state: stopped
        enabled: false
      when: not (enable_webrtc | default(false) | bool)
      failed_when: false

  handlers:
    - name: Restart MediaMTX
      ansible.builtin.systemd:
        name: mediamtx
        state: restarted
        daemon_reload: true

- name: Open Grafana on this machine (http://localhost:3000)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [grafana]
  vars:
    frontend: "{{ hostvars['web-frontend'] }}"
    tunnel_socket: "{{ playbook_dir }}/.grafana-tunnel.sock"
    tunnel_ssh_opts: >-
      -i {{ frontend.ansible_ssh_private_key_file }}
      -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR
  tasks:
    - name: Grafana tunnel
      when:
        - groups.get('monitoring', []) | length > 0
        - open_grafana_tunnel | default(true) | bool
      block:
        - name: Close the previous tunnel, if any
          ansible.builtin.command: ssh -S {{ tunnel_socket }} -O exit monitoring
          register: old_tunnel
          failed_when: false
          changed_when: old_tunnel.rc == 0

        # -f: go to the background once connected; -M -S: a control socket,
        # so the next run can close it; output to /dev/null so Ansible
        # doesn't wait for the background process
        - name: Open the tunnel in the background
          ansible.builtin.shell: >-
            ssh -f -N -M -S {{ tunnel_socket }} {{ tunnel_ssh_opts }}
            -o ExitOnForwardFailure=yes -o ServerAliveInterval=30
            -o ProxyCommand="ssh {{ tunnel_ssh_opts }} -W %h:%p ubuntu@{{ frontend.ansible_host }}"
            -L 127.0.0.1:3000:localhost:3000
            ubuntu@{{ frontend.monitoring_private_ip }}
            </dev/null >/dev/null 2>&1
          register: tunnel
          changed_when: tunnel.rc == 0
          # Port 3000 already taken (e.g. a tunnel opened by hand): report it,
          # but don't fail the deployment for a convenience
          failed_when: false

        - name: Check Grafana through the tunnel
          ansible.builtin.uri:
            url: http://127.0.0.1:3000/api/health
          register: grafana_health
          retries: 5
          delay: 2
          until: grafana_health.status == 200
          failed_when: false

        - name: How to open Grafana
          ansible.builtin.debug:
            msg: >-
              {{ 'Grafana: http://localhost:3000 (user admin; password: terraform output -raw grafana_admin_password)'
                 if grafana_health.status | default(0) == 200
                 else 'Grafana tunnel could not be opened (port 3000 busy?). Retry: ansible-playbook site.yml --tags grafana' }}
