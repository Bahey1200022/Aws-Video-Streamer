# WireGuard tunnel carrying the RTMP ingest (streamer -> frontend)
wg_port: 51820
wg_frontend_ip: 10.99.0.1
wg_streamer_ip: 10.99.0.2

# Video looped by the Video Streamer (Blender open movie, CC BY).
# download.blender.org returns 403 to AWS IPs, so it's fetched on the control
# machine and uploaded to the streamer.
video_title: Elephants Dream
video_file: elephantsdream-480-h264-st-aac.mov
video_url: https://download.blender.org/ED/elephantsdream-480-h264-st-aac.mov
video_dir: /videos

# Let's Encrypt certificate name (staging certificates are kept separate)
cert_name: "{{ fqdn }}{{ '-staging' if letsencrypt_staging | bool else '' }}"
